[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-ai-cti"
version = "0.2.0"
description = "Represent adversarial AI activity (prompt injection, jailbreaks) as structured STIX 2.1 threat intelligence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ashwinvis98", email = "ashwinvis98@gmail.com" }]
keywords = ["stix", "cti", "threat-intelligence", "prompt-injection", "llm-security", "opencti", "mitre-atlas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "stix2>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # line length is owned by the formatter, not the linter

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
